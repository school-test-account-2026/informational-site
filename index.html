<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History of Super Mario</title>
    <style>
        body {
  margin: 0;
  padding: 0;
  }

  .black-bar1 {
            background-color: rgb(6, 23, 121);
            width: 100%;
            height: 40px;
            display: flex;
            align-items: stretch;
            padding: 10 20px;
            box-sizing: border-box;
        }
     .black-bar1 img {
            height: 40px;
            margin-right: 15px;

        display: grid;
        }
    
        .wrapping-image {
  position: absolute;
  top: 3%;
  transform: translateY(-50%); 
  width: 40px;             
  height: auto;
  animation: wrapAround 10s linear infinite;
  overflow: hidden;
  overflow-x: hidden;
    }
     .wrapping-image2 {
  position: absolute;
  top: 3%;
  transform: translateY(-50%); 
  width: 40px;             
  height: 39px;
  animation: wrapAround 10s linear infinite;
  animation-delay: -9.6s;
  overflow: hidden;
  overflow-x: hidden;
    }
    .wrapping-image3 {
  position: absolute;
  top: 3%;
  transform: translateY(-50%); 
  width: 40px;             
  height: 39px;
  animation: wrapAround 10s linear infinite;
  animation-delay: -9.2s;
  overflow: hidden;
  overflow-x: hidden;
    }
    @keyframes wrapAround {
      0% {
        left: -150px; 
      }
      100% {
        left: 100%; 
      }
    }

    @keyframes floatAnimation {
      0% {
        transform: translateY(0px); 
      }
      100% {
        transform: translateY(-20px);
      
    }
    }
    
    body {
    background-image: url("https://htmlhoster.com/p/6V8VX1H6/galaxyskybox.jpg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
    background-color: #0000FF;
    }
    </style>
</head>

<body>
